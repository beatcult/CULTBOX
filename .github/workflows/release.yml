# CULTBOX: a release is made by adding release-notes/vX.Y.md to main (the notes are the release text, vX.Y the tag the
# workflow creates): it builds the FM-1 package (cultbox.fwsc, identity FM-1_666), attests it
# (actions/attest-build-provenance) and publishes a live release with it.
# The Firmware Hub takes the newest release that has a .fwsc attached, so nothing else publishes one.
# The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), the AC79 SDK from gitee.com, as in
# sloopDX's and OberVave's workflows. Run by hand (workflow_dispatch) for a test build without a release.
name: release

on:
  push:
    branches: [main]
    paths: ['release-notes/*.md']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Which release
        id: v
        run: |
          t=$(git diff --name-only HEAD^ HEAD -- release-notes | sed -n 's|^release-notes/\(v[0-9]\.[0-9]\)\.md$|\1|p' | tail -1)
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "release: ${t:-none (a test build)}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build and check
        run: |
          T="${{ steps.v.outputs.tag }}"
          if [ -n "$T" ]; then sh build.sh --release "${T#v}"; else sh build.sh; fi
          ls -l build/cultbox.fwsc
          calls=$(grep -oE "call [^ ]*__[a-z0-9_]+" build/cultbox.dis | sort -u | head -5 | tr '\n' ' ')
          echo "software-float helper calls: ${calls:-none}"
          (cd build && sha256sum cultbox.fwsc > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: cultbox-fwsc
          path: build/cultbox.fwsc
          if-no-files-found: error

      - name: Attest the package 
        if: steps.v.outputs.tag != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/cultbox.fwsc

      - name: Release 
        if: steps.v.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/cultbox.fwsc
            build/SHA256SUMS
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CULTBOX ${{ steps.v.outputs.tag }}
          body_path: release-notes/${{ steps.v.outputs.tag }}.md
          prerelease: false
          make_latest: true
