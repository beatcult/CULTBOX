# CULTBOX plugins: build CLAP, VST3 (and AU on macOS) for Linux, macOS and Windows, test them, keep them as build artifacts.
# Nothing here publishes a firmware release (release.yml owns those, and the Firmware Hub takes the newest release with a
# .fwsc). Pushing a tag plugins-v* attaches the zips to a *pre-release* with no .fwsc, so the Hub ignores it.
# The Mac builds are not signed or notarised (see plugin/README.md for the install note).
name: plugins

on:
  push:
    branches: [main, plugin-core]
    paths: ['plugin/**', 'firmware/src/**', 'tests/core_*', '.github/workflows/plugins.yml']
    tags: ['plugins-v*']
  pull_request:
    paths: ['plugin/**', 'firmware/src/**', 'tests/core_*', '.github/workflows/plugins.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  name: linux}
          - {os: macos-latest,   name: macos}
          - {os: windows-latest, name: windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # tests/core_check.sh compares with origin/main

      - name: "Linux: the engines still render as on main, then the plugin host test"
        if: matrix.name == 'linux'
        run: |
          cc -o /tmp/core_rate_test tests/core_rate_test.c -lm && /tmp/core_rate_test
          sh tests/core_check.sh origin/main
          sh plugin/test/run.sh

      - name: Configure (Linux)
        if: matrix.name == 'linux'
        run: cmake -S plugin -B build/w -DCULTBOX_WRAPPER=ON -DCMAKE_BUILD_TYPE=Release
      - name: Configure (macOS, Apple silicon and Intel in one)
        if: matrix.name == 'macos'
        run: cmake -S plugin -B build/w -DCULTBOX_WRAPPER=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Configure (Windows, clang-cl)
        if: matrix.name == 'windows'
        run: cmake -S plugin -B build/w -A x64 -T ClangCL -DCULTBOX_WRAPPER=ON

      - name: Build
        run: cmake --build build/w --config Release --target cultbox-plvks_all cultbox-dubmarine_all --parallel 4

      - name: What was built
        shell: bash
        run: find build/w -path '*plugins*' \( -name '*.clap' -o -name '*.vst3' -o -name '*.component' \) -maxdepth 4

      - name: "macOS: both architectures in each binary"
        if: matrix.name == 'macos'
        run: for f in build/w/plugins/*/*/Contents/MacOS/* build/w/plugins/*/Contents/MacOS/*; do [ -f "$f" ] && lipo -info "$f"; done
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/CULTBOX-plugins
          find build/w -path '*plugins*' -maxdepth 4 \( -name '*.clap' -o -name '*.vst3' -o -name '*.component' \) \
              -exec cp -R {} dist/CULTBOX-plugins/ \;
          cp plugin/INSTALL-${{ matrix.name }}.txt dist/CULTBOX-plugins/INSTALL.txt
          cp LICENSE* dist/CULTBOX-plugins/ 2>/dev/null || true
          cd dist
          if [ "${{ matrix.name }}" = windows ]; then
              powershell -Command "Compress-Archive -Path CULTBOX-plugins -DestinationPath CULTBOX-plugins-windows.zip"
          else
              zip -r -y CULTBOX-plugins-${{ matrix.name }}.zip CULTBOX-plugins
          fi
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: CULTBOX-plugins-${{ matrix.name }}
          path: dist/CULTBOX-plugins-${{ matrix.name }}.zip

  prerelease:
    if: startsWith(github.ref, 'refs/tags/plugins-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CULTBOX-plugins-*
          path: dist
          merge-multiple: true
      - name: "Pre-release (no .fwsc, so the Firmware Hub does not take it)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --prerelease \
              --title "CULTBOX plugins ${{ github.ref_name }}" \
              --notes "CLAP and VST3 (AU on macOS) builds of PLVKS and DUBMARINE. Not firmware: no .fwsc here. Mac builds are not signed; see the INSTALL.txt in each zip."
